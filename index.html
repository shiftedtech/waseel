<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EE2A35">
  
  <title>Waseel • Quran Memory Tester</title>
  <meta name="description" content="Waseel is a minimal random Quran Ayah generator designed to test your Hifz memory recall by Juzuk.">
  <meta name="keywords" content="Waseel, Waseel Quran, Quran memory tester, random ayah generator, test hifz, Juzuk tester">

  <!-- Embedded SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 88 C20 65 5 45 5 28 A22 22 0 0 1 45 15 L50 22 L55 15 A22 22 0 0 1 95 28 C95 45 80 65 50 88 Z' fill='%23000000'/><path d='M5 28 C5 15 20 8 35 12 L50 22 L65 12 C80 8 95 15 95 28 C95 38 87 50 72 61 L50 48 L5 28 Z' fill='%23FFFFFF'/><path d='M50 48 L72 61 C57 73 38 82 50 88 C20 65 5 45 5 28 L50 48 Z' fill='%23009736'/><path d='M5 28 L50 50 L5 72 Z' fill='%23EE2A35'/></svg>">

  <!-- Web App Manifest -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Waseel%20Quran%20Tester%22%2C%22short_name%22%3A%22Waseel%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23FFFFFF%22%2C%22theme_color%22%3A%22%23EE2A35%22%7D">

  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #FFFFFF;
      color: #000000;
    }
    .card {
      background-color: #FFFFFF;
      padding: 32px;
      border-radius: 16px;
      max-width: 650px;
      margin: 20px auto;
      border: 2px solid #000000;
      box-shadow: 0 8px 0px #000000;
    }
    h2 { color: #000000; margin-top: 0; font-weight: 800; }
    .controls {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    select {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #000000;
      background-color: #FFFFFF;
      color: #000000;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      width: 100%;
      max-width: 250px;
    }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn-primary {
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #000000;
      background-color: #EE2A35;
      color: #FFFFFF;
      transition: transform 0.1s;
    }
    .btn-primary:active { transform: translateY(2px); }
    .btn-success {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #000000;
      background-color: #009736;
      color: #FFFFFF;
      margin-top: 15px;
    }
    .btn-outline {
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #000000;
      background-color: #FFFFFF;
      color: #000000;
    }
    .arabic {
      font-size: 34px;
      font-family: 'Amiri Quran', serif;
      direction: rtl;
      margin: 20px 0;
      line-height: 2.3;
      color: #000000;
      word-spacing: 4px;
    }
    .translation-text {
      font-size: 15px;
      font-style: italic;
      color: #374151;
      margin: 10px 0 15px 0;
      padding: 10px;
      background-color: #f9fafb;
      border-radius: 8px;
      border: 1px dashed #d1d5db;
    }
    .meta-tag {
      display: inline-block;
      background-color: #000000;
      color: #FFFFFF;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
    }
    .reveal-box { margin-top: 20px; padding-top: 20px; border-top: 2px solid #000000; }
    .status-msg { font-weight: 600; margin: 15px 0; color: #EE2A35; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Waseel • Quran Memory Tester</h2>
    
    <div class="controls">
      <label for="juzSelect"><strong>Select Scope:</strong></label>
      <select id="juzSelect">
        <option value="all">All Juzuk (1 - 30)</option>
      </select>
      
      <div class="btn-group">
        <button class="btn-primary" onclick="generateRandomAyah()">Generate Random Verse</button>
        <button class="btn-outline" onclick="shareWebsite()">Share / Nearby Device</button>
      </div>
    </div>

    <div id="status" class="status-msg hidden"></div>

    <div id="quizSection" class="hidden">
      <div class="meta-tag" id="meta"></div>
      <div id="arabicText" class="arabic"></div>
      
      <div id="mainTranslation" class="translation-text hidden"></div>

      <div>
        <button class="btn-outline" style="padding: 8px 16px; font-size: 14px;" onclick="toggleTranslation('main')">Show / Hide English</button>
      </div>
      
      <button class="btn-success" onclick="revealNextAyah()">Reveal Next Verse</button>
      
      <div id="revealBox" class="reveal-box hidden">
        <div style="font-weight: bold; color: #009736; margin-bottom: 8px;">Next Verse:</div>
        <div id="nextVerse" class="arabic"></div>
        <div id="nextTranslation" class="translation-text hidden"></div>
        
        <div>
          <button class="btn-outline" style="padding: 8px 16px; font-size: 14px;" onclick="toggleTranslation('next')">Show / Hide English</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // FormSubmit Telemetry Endpoint
    const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/el/heviyu";

    // Local embedded dataset (Guarantees zero network issues)
    const AYAH_DATABASE = [
      { juz: 1, surah: "Al-Fatiha", surahNum: 1, ayahNum: 1, text: "بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ", trans: "In the name of Allah, the Entirely Merciful, the Especially Merciful.", nextText: "ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَـٰلَمِينَ", nextTrans: "[All] praise is due to Allah, Lord of the worlds -" },
      { juz: 1, surah: "Al-Baqarah", surahNum: 2, ayahNum: 255, text: "ٱللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌ۠ وَلَا نَوْمٌ۠", trans: "Allah - there is no deity except Him, the Ever-Living, the Sustainer of [all] existence. Neither drowsiness overtakes Him nor sleep.", nextText: "لَّآ إِكْرَاهَ فِى ٱلدِّينِ ۖ قَد تَّبَيَّنَ ٱلرُّشْدُ مِنَ ٱلْغَىِّ ۚ", nextTrans: "There shall be no compulsion in [acceptance of] the religion. The right course has become clear from the wrong." },
      { juz: 28, surah: "Al-Mujadila", surahNum: 58, ayahNum: 1, text: "قَدْ سَمِعَ ٱللَّهُ قَوْلَ ٱلَّتِى تُجَـٰدِلُكَ فِى زَوْجِهَا وَتَشْتَكِىٓ إِلَى ٱللَّهِ", trans: "Allah has certainly heard the speech of the one who argues with you concerning her husband and directs her complaint to Allah.", nextText: "ٱلَّذِينَ يُظَـٰهِرُونَ مِنكُم مِّن نِّسَآئِهِم مَّا هُنَّ أُمَّهَـٰتِهِمْ ۖ", nextTrans: "Those who pronounce zihar among you to separate from their wives - they are not or cannot be their mothers." },
      { juz: 29, surah: "Al-Mulk", surahNum: 67, ayahNum: 1, text: "تَبَـٰرَكَ ٱلَّذِى بِيَدِهِ ٱلْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ", trans: "Blessed is He in whose hand is dominion, and He is over all things competent -", nextText: "ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلً۠ا ۚ", nextTrans: "[He] who created death and life to test you as to which of you is best in deed -" },
      { juz: 30, surah: "An-Naba", surahNum: 78, ayahNum: 1, text: "عَمَّ يَتَسَآءَلُونَ", trans: "About what are they asking one another?", nextText: "عَنِ ٱلنَّبَإِ ٱلْعَظِيمِ", nextTrans: "About the great news -" },
      { juz: 30, surah: "Al-Ikhlas", surahNum: 112, ayahNum: 1, text: "قُلْ هُوَ ٱللَّهُ أَحَدٌ", trans: "Say, \"He is Allah, [who is] One,", nextText: "ٱللَّهُ ٱلصَّمَدُ", nextTrans: "Allah, the Eternal Refuge." }
    ];

    const juzSelect = document.getElementById('juzSelect');
    for (let i = 1; i <= 30; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `Juzuk ${i}`;
      juzSelect.appendChild(opt);
    }

    let currentItem = null;

    // Automated error alert trigger
    async function sendErrorLog(errorMessage) {
      try {
        await fetch(FORMSUBMIT_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            subject: 'Waseel App Telemetry: Error Detected',
            timestamp: new Date().toISOString(),
            error: errorMessage,
            user_agent: navigator.userAgent
          })
        });
      } catch (e) {}
    }

    function generateRandomAyah() {
      const selectedJuz = juzSelect.value;
      const quizSection = document.getElementById('quizSection');
      const revealBox = document.getElementById('revealBox');
      const status = document.getElementById('status');
      const mainTrans = document.getElementById('mainTranslation');

      try {
        revealBox.classList.add('hidden');
        mainTrans.classList.add('hidden');
        document.getElementById('nextTranslation').classList.add('hidden');
        document.getElementById('nextVerse').innerText = '';
        status.classList.add('hidden');

        let pool = AYAH_DATABASE;
        if (selectedJuz !== 'all') {
          pool = AYAH_DATABASE.filter(item => item.juz === parseInt(selectedJuz));
        }

        if (pool.length === 0) pool = AYAH_DATABASE;

        currentItem = pool[Math.floor(Math.random() * pool.length)];

        document.getElementById('meta').innerText = `Surah ${currentItem.surah} (${currentItem.surahNum}:${currentItem.ayahNum}) • Juzuk ${currentItem.juz}`;
        document.getElementById('arabicText').innerText = currentItem.text;
        mainTrans.innerText = `"${currentItem.trans}"`;

        quizSection.classList.remove('hidden');

      } catch (err) {
        sendErrorLog(err.message);
        status.innerText = "Error generating verse. Telemetry logged.";
        status.classList.remove('hidden');
      }
    }

    function revealNextAyah() {
      try {
        const revealBox = document.getElementById('revealBox');
        const nextVerseDiv = document.getElementById('nextVerse');
        const nextTrans = document.getElementById('nextTranslation');

        nextVerseDiv.innerText = currentItem.nextText;
        nextTrans.innerText = `"${currentItem.nextTrans}"`;
        revealBox.classList.remove('hidden');
      } catch (err) {
        sendErrorLog(err.message);
      }
    }

    function toggleTranslation(type) {
      const target = type === 'main' ? document.getElementById('mainTranslation') : document.getElementById('nextTranslation');
      target.classList.toggle('hidden');
    }

    async function shareWebsite() {
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Waseel • Quran Memory Tester',
            text: 'Practice and test your Quran memory with this random Ayah generator.',
            url: window.location.href
          });
        } catch (err) {}
      } else {
        try {
          await navigator.clipboard.writeText(window.location.href);
          alert('Website link copied to clipboard!');
        } catch (err) {
          alert('Copy link manually: ' + window.location.href);
        }
      }
    }
  </script>

</body>
</html>
