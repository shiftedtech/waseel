<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EE2A35">

  <title>Waseel • Quran Memory Tester</title>

  <meta
    name="description"
    content="Waseel is a minimal random Quran Ayah generator designed to test your Hifz memory by Juzuk."
  >

  <meta
    name="keywords"
    content="Waseel, Quran memory tester, random ayah generator, Hifz tester, Juzuk tester"
  >

  <!-- Embedded SVG Favicon -->
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 88 C20 65 5 45 5 28 A22 22 0 0 1 45 15 L50 22 L55 15 A22 22 0 0 1 95 28 C95 45 80 65 50 88 Z' fill='%23000000'/%3E%3Cpath d='M5 28 C5 15 20 8 35 12 L50 22 L65 12 C80 8 95 15 95 28 C95 38 87 50 72 61 L50 48 L5 28 Z' fill='%23FFFFFF'/%3E%3Cpath d='M50 48 L72 61 C57 73 38 82 50 88 C20 65 5 45 5 28 L50 48 Z' fill='%23009736'/%3E%3Cpath d='M5 28 L50 50 L5 72 Z' fill='%23EE2A35'/%3E%3C/svg%3E"

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      background-color: #ffffff;
      color: #000000;
    }

    .card {
      background-color: #ffffff;
      padding: 32px;
      border-radius: 16px;
      max-width: 650px;
      margin: 20px auto;
      border: 2px solid #000000;
      box-shadow: 8px 8px 0 #000000;
    }

    h2 {
      color: #000000;
      margin-top: 0;
      font-weight: 800;
      line-height: 1.3;
    }

    .controls {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    select {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #000000;
      background-color: #ffffff;
      color: #000000;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      width: 100%;
      max-width: 250px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      font-family: inherit;
    }

    .btn-primary,
    .btn-success,
    .btn-outline,
    .btn-audio {
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .btn-primary:active,
    .btn-success:active,
    .btn-outline:active,
    .btn-audio:active {
      transform: translateY(2px);
    }

    .btn-primary {
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      border: 2px solid #000000;
      background-color: #ee2a35;
      color: #ffffff;
    }

    .btn-success {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      border: 2px solid #000000;
      background-color: #009736;
      color: #ffffff;
      margin-top: 15px;
    }

    .btn-outline {
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      border: 2px solid #000000;
      background-color: #ffffff;
      color: #000000;
    }

    .small-outline {
      padding: 8px 16px;
      font-size: 14px;
    }

    .btn-audio {
      background-color: #000000;
      color: #ffffff;
      border: 2px solid #000000;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin: 5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .arabic {
      font-size: 34px;
      font-family: "Amiri Quran", serif;
      direction: rtl;
      margin: 20px 0;
      line-height: 2.3;
      color: #000000;
      word-spacing: 4px;
      overflow-wrap: anywhere;
    }

    .translation-text {
      font-size: 15px;
      font-style: italic;
      color: #374151;
      margin: 10px 0 15px;
      padding: 10px;
      background-color: #f9fafb;
      border-radius: 8px;
      border: 1px dashed #d1d5db;
      line-height: 1.6;
      text-align: left;
    }

    .meta-tag {
      display: inline-block;
      background-color: #000000;
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
    }

    .reveal-box {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid #000000;
    }

    .status-msg {
      font-weight: 600;
      margin: 15px 0;
      color: #ee2a35;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 22px 16px;
        box-shadow: 5px 5px 0 #000000;
      }

      .arabic {
        font-size: 29px;
      }

      .btn-primary,
      .btn-outline {
        width: 100%;
      }

      .btn-group {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Waseel • Quran Memory Tester</h2>

    <div class="controls">
      <label for="juzSelect">
        <strong>Select Scope:</strong>
      </label>

      <select id="juzSelect">
        <option value="all">All Juzuk (1–30)</option>
      </select>

      <div class="btn-group">
        <button
          type="button"
          class="btn-primary"
          id="generateButton"
        >
          Generate Random Verse
        </button>
      </div>
    </div>

    <div id="status" class="status-msg hidden"></div>

    <div id="quizSection" class="hidden">
      <div class="meta-tag" id="meta"></div>

      <div id="arabicText" class="arabic"></div>

      <div id="mainTranslation" class="translation-text hidden"></div>

      <div>
        <button
          type="button"
          id="btnAudioMain"
          class="btn-audio"
        >
          ▶ Listen (Al-Hussary)
        </button>

        <button
          type="button"
          id="translationMainButton"
          class="btn-outline small-outline"
        >
          Show / Hide English
        </button>
      </div>

      <audio id="audioMain" preload="none"></audio>

      <button
        type="button"
        class="btn-success"
        id="revealButton"
      >
        Reveal Next Verse
      </button>

      <div id="revealBox" class="reveal-box hidden">
        <div
          style="font-weight: bold; color: #009736; margin-bottom: 8px;"
        >
          Next Verse:
        </div>

        <div id="nextVerse" class="arabic"></div>

        <div
          id="nextTranslation"
          class="translation-text hidden"
        ></div>

        <div>
          <button
            type="button"
            id="btnAudioNext"
            class="btn-audio"
          >
            ▶ Listen Next Verse
          </button>

          <button
            type="button"
            id="translationNextButton"
            class="btn-outline small-outline"
          >
            Show / Hide English
          </button>
        </div>

        <audio id="audioNext" preload="none"></audio>
      </div>
    </div>
  </div>
