<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akmil - Quran Memory Tester</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #FFFFFF; /* Main White Background */
      color: #000000;             /* Pure Black Text */
    }
    .card {
      background-color: #FFFFFF;
      padding: 32px;
      border-radius: 16px;
      max-width: 650px;
      margin: 20px auto;
      border: 2px solid #000000;  /* High contrast black border */
      box-shadow: 0 8px 0px #000000;
    }
    h2 { 
      color: #000000; 
      margin-top: 0;
      font-weight: 800;
    }
    .controls {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    select {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #000000;
      background-color: #FFFFFF;
      color: #000000;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      width: 100%;
      max-width: 250px;
    }
    /* Primary Action: Red Accent */
    .btn-primary {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #000000;
      background-color: #EE2A35; /* Red */
      color: #FFFFFF;            /* White Text */
      transition: transform 0.1s;
    }
    .btn-primary:active { transform: translateY(2px); }

    /* Reveal / Secondary Action: Green Accent */
    .btn-success {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #000000;
      background-color: #009736; /* Green */
      color: #FFFFFF;            /* White Text */
      margin-top: 15px;
    }

    .arabic {
      font-size: 32px;
      font-family: 'Amiri', serif;
      direction: rtl;
      margin: 24px 0;
      line-height: 2;
      color: #000000;
    }
    .meta-tag {
      display: inline-block;
      background-color: #000000;
      color: #FFFFFF;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
    }
    .reveal-box {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid #000000;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Akmil • Quran Memory Tester</h2>
    
    <div class="controls">
      <label for="juzSelect"><strong>Select Scope:</strong></label>
      <select id="juzSelect">
        <option value="all">All Juzuk (1 - 30)</option>
      </select>
      
      <button class="btn-primary" onclick="generateRandomAyah()">Generate Random Verse</button>
    </div>

    <div id="quizSection" class="hidden">
      <div class="meta-tag" id="meta">Surah Al-Baqarah (2:255) • Juz 3</div>
      <div id="arabicText" class="arabic">اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...</div>
      
      <button class="btn-success" onclick="revealNextAyah()">Reveal Next Verse</button>
      
      <div id="revealBox" class="reveal-box hidden">
        <div style="font-weight: bold; color: #009736; margin-bottom: 8px;">Next Verse:</div>
        <div id="nextVerse" class="arabic"></div>
      </div>
    </div>
  </div>

</body>
</html>
