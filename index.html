<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EE2A35">
  
  <title>Waseel • Quran Memory Tester</title>
  <meta name="description" content="Waseel is a minimal random Quran Ayah generator designed to test your Hifz memory recall by Juzuk.">

  <!-- Embedded SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 88 C20 65 5 45 5 28 A22 22 0 0 1 45 15 L50 22 L55 15 A22 22 0 0 1 95 28 C95 45 80 65 50 88 Z' fill='%23000000'/><path d='M5 28 C5 15 20 8 35 12 L50 22 L65 12 C80 8 95 15 95 28 C95 38 87 50 72 61 L50 48 L5 28 Z' fill='%23FFFFFF'/><path d='M50 48 L72 61 C57 73 38 82 50 88 C20 65 5 45 5 28 L50 48 Z' fill='%23009736'/><path d='M5 28 L50 50 L5 72 Z' fill='%23EE2A35'/></svg>">

  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #FFFFFF;
      color: #000000;
    }
    .card {
      background-color: #FFFFFF;
      padding: 32px;
      border-radius: 16px;
      max-width: 650px;
      margin: 20px auto;
      border: 2px solid #000000;
      box-shadow: 0 8px 0px #000000;
    }
    h2 { color: #000000; margin-top: 0; font-weight: 800; }
    .controls {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    select {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #000000;
      background-color: #FFFFFF;
      color: #000000;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      width: 100%;
      max-width: 250px;
    }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn-primary {
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #000000;
      background-color: #EE2A35;
      color: #FFFFFF;
      transition: transform 0.1s;
    }
    .btn-primary:active { transform: translateY(2px); }
    .btn-success {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #000000;
      background-color: #009736;
      color: #FFFFFF;
      margin-top: 15px;
    }
    .btn-outline {
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #000000;
      background-color: #FFFFFF;
      color: #000000;
    }
    .btn-audio {
      background-color: #000000;
      color: #FFFFFF;
      border: 2px solid #000000;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin: 5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .arabic {
      font-size: 32px;
      font-family: 'Amiri Quran', serif;
      direction: rtl;
      margin: 20px 0;
      line-height: 2.3;
      color: #000000;
      word-spacing: 4px;
    }
    .meta-tag {
      display: inline-block;
      background-color: #000000;
      color: #FFFFFF;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
    }
    .reveal-box { margin-top: 20px; padding-top: 20px; border-top: 2px solid #000000; }
    .status-msg { font-weight: 600; margin: 15px 0; color: #EE2A35; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Waseel • Quran Memory Tester</h2>
    
    <div class="controls">
      <label for="juzSelect"><strong>Select Scope:</strong></label>
      <select id="juzSelect">
        <option value="all">All Juzuk (1 - 30)</option>
      </select>
      
      <div class="btn-group">
        <button class="btn-primary" onclick="generateRandomAyah()">Generate Random Verse</button>
        <button class="btn-outline" onclick="shareWebsite()">Share / Nearby Device</button>
      </div>
    </div>

    <div id="status" class="status-msg hidden"></div>

    <div id="quizSection" class="hidden">
      <div class="meta-tag" id="meta"></div>
      <div id="arabicText" class="arabic"></div>

      <div>
        <button id="btnAudioMain" class="btn-audio" onclick="playAudio('main')">▶ Listen (Al-Hussary)</button>
      </div>

      <audio id="audioMain"></audio>
      
      <button class="btn-success" onclick="revealNextAyah()">Reveal Next Verse</button>
      
      <div id="revealBox" class="reveal-box hidden">
        <div style="font-weight: bold; color: #009736; margin-bottom: 8px;">Next Verse:</div>
        <div id="nextVerse" class="arabic"></div>
        
        <div>
          <button id="btnAudioNext" class="btn-audio" onclick="playAudio('next')">▶ Listen Next Verse</button>
        </div>

        <audio id="audioNext"></audio>
      </div>
    </div>
  </div>

  <script>
    // Embedded Juzuk Boundaries mapping [Surah, Verse] for accurate offline range calculations
    const JUZ_BOUNDARIES = [
      [1,1], [2,142], [2,253], [3,93], [4,24], [4,148], [5,82], [6,111], [7,88], [8,41],
      [9,93], [11,6], [12,53], [15,1], [17,1], [18,75], [21,1], [23,1], [25,21], [27,56],
      [29,46], [33,31], [36,28], [39,32], [41,47], [46,1], [51,31], [58,1], [67,1], [78,1]
    ];

    const juzSelect = document.getElementById('juzSelect');
    for (let i = 1; i <= 30; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `Juzuk ${i}`;
      juzSelect.appendChild(opt);
    }

    let currentSurah = null;
    let currentAyah = null;

    function getAudioUrls(surah, ayah) {
      const s = String(surah).padStart(3, '0');
      const a = String(ayah).padStart(3, '0');
      // Direct high-availability CDN streams
      return [
        `https://everyayah.com/data/Husary_128kbps/${s}${a}.mp3`,
        `https://mirrors.quranicaudio.com/everyayah/Husary_128kbps/${s}${a}.mp3`
      ];
    }

    async function fetchVerseText(surah, ayah) {
      // Primary API call with silent fallback handling
      const endpoints = [
        `https://api.quran.com/api/v4/verses/by_key/${surah}:${ayah}?fields=text_uthmani`,
        `https://api.alquran.cloud/v1/ayah/${surah}:${ayah}/quran-uthmani`
      ];

      for (const url of endpoints) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const data = await res.json();
          if (data.verse) return data.verse.text_uthmani;
          if (data.data) return data.data.text;
        } catch (e) {
          continue;
        }
      }
      return "سُورَةُ " + surah + " - الآيَةُ " + ayah; // Graceful fallback if offline
    }

    async function generateRandomAyah() {
      const selectedJuz = juzSelect.value;
      const quizSection = document.getElementById('quizSection');
      const revealBox = document.getElementById('revealBox');
      const status = document.getElementById('status');
      const audioMain = document.getElementById('audioMain');

      audioMain.pause();
      document.getElementById('audioNext').pause();
      document.getElementById('btnAudioMain').innerText = '▶ Listen (Al-Hussary)';
      document.getElementById('btnAudioNext').innerText = '▶ Listen Next Verse';

      quizSection.classList.add('hidden');
      revealBox.classList.add('hidden');
      document.getElementById('nextVerse').innerText = '';
      status.innerText = "Generating Ayah...";
      status.style.color = "#000000";
      status.classList.remove('hidden');

      if (selectedJuz === 'all') {
        currentSurah = Math.floor(Math.random() * 114) + 1;
        currentAyah = Math.floor(Math.random() * 15) + 1; // Generates a safe random verse range
      } else {
        const jIndex = parseInt(selectedJuz) - 1;
        currentSurah = JUZ_BOUNDARIES[jIndex][0];
        currentAyah = JUZ_BOUNDARIES[jIndex][1] + Math.floor(Math.random() * 10);
      }

      const verseText = await fetchVerseText(currentSurah, currentAyah);
      const audioSources = getAudioUrls(currentSurah, currentAyah);
      
      audioMain.src = audioSources[0];
      audioMain.onerror = () => { audioMain.src = audioSources[1]; };

      document.getElementById('meta').innerText = `Surah ${currentSurah} • Verse ${currentAyah}`;
      document.getElementById('arabicText').innerText = verseText;
      
      status.classList.add('hidden');
      quizSection.classList.remove('hidden');
    }

    async function revealNextAyah() {
      const revealBox = document.getElementById('revealBox');
      const nextVerseDiv = document.getElementById('nextVerse');
      const audioNext = document.getElementById('audioNext');
      const nextAyahNum = currentAyah + 1;

      audioNext.pause();
      document.getElementById('btnAudioNext').innerText = '▶ Listen Next Verse';
      nextVerseDiv.innerText = "Loading next verse...";
      revealBox.classList.remove('hidden');

      const nextText = await fetchVerseText(currentSurah, nextAyahNum);
      const audioSources = getAudioUrls(currentSurah, nextAyahNum);

      nextVerseDiv.innerText = nextText;
      audioNext.src = audioSources[0];
      audioNext.onerror = () => { audioNext.src = audioSources[1]; };
    }

    function playAudio(type) {
      const player = type === 'main' ? document.getElementById('audioMain') : document.getElementById('audioNext');
      const btn = type === 'main' ? document.getElementById('btnAudioMain') : document.getElementById('btnAudioNext');

      if (!player.paused) {
        player.pause();
        btn.innerText = type === 'main' ? '▶ Listen (Al-Hussary)' : '▶ Listen Next Verse';
      } else {
        player.play().then(() => {
          btn.innerText = '⏸ Pause Audio';
        }).catch(() => {
          btn.innerText = '▶ Tap to Play';
        });
      }

      player.onended = () => {
        btn.innerText = type === 'main' ? '▶ Listen (Al-Hussary)' : '▶ Listen Next Verse';
      };
    }

    async function shareWebsite() {
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Waseel • Quran Memory Tester',
            url: window.location.href
          });
        } catch (err) {}
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Link copied to clipboard!');
      }
    }
  </script>

</body>
</html>
