<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EE2A35">
  
  <title>Waseel • Quran Memory Tester</title>
  <meta name="description" content="Waseel is a minimal random Quran Ayah generator designed to test your Hifz memory recall by Juzuk.">

  <!-- Embedded SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 88 C20 65 5 45 5 28 A22 22 0 0 1 45 15 L50 22 L55 15 A22 22 0 0 1 95 28 C95 45 80 65 50 88 Z' fill='%23000000'/><path d='M5 28 C5 15 20 8 35 12 L50 22 L65 12 C80 8 95 15 95 28 C95 38 87 50 72 61 L50 48 L5 28 Z' fill='%23FFFFFF'/><path d='M5 28 L50 50 L5 72 Z' fill='%23EE2A35'/></svg>">

  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #FFFFFF;
      color: #000000;
    }
    .card {
      background-color: #FFFFFF;
      padding: 32px;
      border-radius: 16px;
      max-width: 650px;
      margin: 20px auto;
      border: 2px solid #000000;
      box-shadow: 0 8px 0px #000000;
    }
    h2 { color: #000000; margin-top: 0; font-weight: 800; }
    .controls {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    select {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #000000;
      background-color: #FFFFFF;
      color: #000000;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      width: 100%;
      max-width: 250px;
    }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn-primary {
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #000000;
      background-color: #EE2A35;
      color: #FFFFFF;
      transition: transform 0.1s;
    }
    .btn-primary:active { transform: translateY(2px); }
    .btn-success {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #000000;
      background-color: #009736;
      color: #FFFFFF;
      margin-top: 15px;
    }
    .btn-outline {
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #000000;
      background-color: #FFFFFF;
      color: #000000;
    }
    .arabic {
      font-size: 32px;
      font-family: 'Amiri Quran', serif;
      direction: rtl;
      margin: 20px 0;
      line-height: 2.3;
      color: #000000;
      word-spacing: 4px;
    }
    .meta-tag {
      display: inline-block;
      background-color: #000000;
      color: #FFFFFF;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
    }
    .reveal-box { margin-top: 20px; padding-top: 20px; border-top: 2px solid #000000; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Waseel • Quran Memory Tester</h2>
    
    <div class="controls">
      <label for="juzSelect"><strong>Select Scope:</strong></label>
      <select id="juzSelect">
        <option value="all">All Selected Juzuk</option>
      </select>
      
      <div class="btn-group">
        <button class="btn-primary" onclick="generateRandomAyah()">Generate Random Verse</button>
        <button class="btn-outline" onclick="shareWebsite()">Share / Nearby Device</button>
      </div>
    </div>

    <div id="quizSection" class="hidden">
      <div class="meta-tag" id="meta"></div>
      <div id="arabicText" class="arabic"></div>

      <button class="btn-success" onclick="revealNextAyah()">Reveal Next Verse</button>
      
      <div id="revealBox" class="reveal-box hidden">
        <div style="font-weight: bold; color: #009736; margin-bottom: 8px;">Next Verse:</div>
        <div id="nextVerse" class="arabic"></div>
      </div>
    </div>
  </div>

  <script>
    // Embedded sample dataset across multiple Juzuk (Guarantees offline stability)
    const AYAH_DATABASE = [
      { juz: 1, surah: "Al-Fatiha", surahNum: 1, ayahNum: 1, text: "بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ", nextText: "ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَـٰلَمِينَ" },
      { juz: 1, surah: "Al-Baqarah", surahNum: 2, ayahNum: 255, text: "ٱللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌ۠ وَلَا نَوْمٌ۠", nextText: "لَّآ إِكْرَاهَ فِى ٱلدِّينِ ۖ قَد تَّبَيَّنَ ٱلرُّشْدُ مِنَ ٱلْغَىِّ ۚ" },
      { juz: 28, surah: "Al-Mujadila", surahNum: 58, ayahNum: 1, text: "قَدْ سَمِعَ ٱللَّهُ قَوْلَ ٱلَّتِى تُجَـٰدِلُكَ فِى زَوْجِهَا وَتَشْتَكِىٓ إِلَى ٱللَّهِ", nextText: "ٱلَّذِينَ يُظَـٰهِرُونَ مِنكُم مِّن نِّسَآئِهِم مَّا هُنَّ أُمَّهَـٰتِهِمْ ۖ" },
      { juz: 29, surah: "Al-Mulk", surahNum: 67, ayahNum: 1, text: "تَبَـٰرَكَ ٱلَّذِى بِيَدِهِ ٱلْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ", nextText: "ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلً۠ا ۚ" },
      { juz: 30, surah: "An-Naba", surahNum: 78, ayahNum: 1, text: "عَمَّ يَتَسَآءَلُونَ", nextText: "عَنِ ٱلنَّبَإِ ٱلْعَظِيمِ" },
      { juz: 30, surah: "An-Nazi'at", surahNum: 79, ayahNum: 1, text: "وَٱلنَّـٰزِعَـٰتِ غَرْقً۠ا", nextText: "وَٱلنَّـٰشِطَـٰتِ نَشْطً۠ا" },
      { juz: 30, surah: "Al-Ikhlas", surahNum: 112, ayahNum: 1, text: "قُلْ هُوَ ٱللَّهُ أَحَدٌ", nextText: "ٱللَّهُ ٱلصَّمَدُ" }
    ];

    const juzSelect = document.getElementById('juzSelect');
    const availableJuz = [...new Set(AYAH_DATABASE.map(item => item.juz))];

    availableJuz.forEach(juz => {
      const opt = document.createElement('option');
      opt.value = juz;
      opt.textContent = `Juzuk ${juz}`;
      juzSelect.appendChild(opt);
    });

    let currentItem = null;

    function generateRandomAyah() {
      const selectedJuz = juzSelect.value;
      const quizSection = document.getElementById('quizSection');
      const revealBox = document.getElementById('revealBox');

      revealBox.classList.add('hidden');
      document.getElementById('nextVerse').innerText = '';

      let pool = AYAH_DATABASE;
      if (selectedJuz !== 'all') {
        pool = AYAH_DATABASE.filter(item => item.juz === parseInt(selectedJuz));
      }

      currentItem = pool[Math.floor(Math.random() * pool.length)];

      document.getElementById('meta').innerText = `Surah ${currentItem.surah} (${currentItem.surahNum}:${currentItem.ayahNum}) • Juzuk ${currentItem.juz}`;
      document.getElementById('arabicText').innerText = currentItem.text;

      quizSection.classList.remove('hidden');
    }

    function revealNextAyah() {
      const revealBox = document.getElementById('revealBox');
      const nextVerseDiv = document.getElementById('nextVerse');

      nextVerseDiv.innerText = currentItem.nextText;
      revealBox.classList.remove('hidden');
    }

    async function shareWebsite() {
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Waseel • Quran Memory Tester',
            url: window.location.href
          });
        } catch (err) {}
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Link copied to clipboard!');
      }
    }
  </script>

</body>
</html>
