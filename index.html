<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akmil • Quran Memory Tester</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #FFFFFF;
      color: #000000;
    }
    .card {
      background-color: #FFFFFF;
      padding: 32px;
      border-radius: 16px;
      max-width: 650px;
      margin: 20px auto;
      border: 2px solid #000000;
      box-shadow: 0 8px 0px #000000;
    }
    h2 { 
      color: #000000; 
      margin-top: 0;
      font-weight: 800;
    }
    .controls {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    select {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #000000;
      background-color: #FFFFFF;
      color: #000000;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      width: 100%;
      max-width: 250px;
    }
    .btn-primary {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #000000;
      background-color: #EE2A35;
      color: #FFFFFF;
      transition: transform 0.1s;
    }
    .btn-primary:active { transform: translateY(2px); }

    .btn-success {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #000000;
      background-color: #009736;
      color: #FFFFFF;
      margin-top: 15px;
    }

    .arabic {
      font-size: 32px;
      font-family: 'Amiri', serif;
      direction: rtl;
      margin: 24px 0;
      line-height: 2;
      color: #000000;
    }
    .meta-tag {
      display: inline-block;
      background-color: #000000;
      color: #FFFFFF;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
    }
    .reveal-box {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid #000000;
    }
    .status-msg {
      font-weight: 600;
      margin: 15px 0;
      color: #EE2A35;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Akmil • Quran Memory Tester</h2>
    
    <div class="controls">
      <label for="juzSelect"><strong>Select Scope:</strong></label>
      <select id="juzSelect">
        <option value="all">All Juzuk (1 - 30)</option>
      </select>
      
      <button class="btn-primary" onclick="generateRandomAyah()">Generate Random Verse</button>
    </div>

    <div id="status" class="status-msg hidden"></div>

    <div id="quizSection" class="hidden">
      <div class="meta-tag" id="meta"></div>
      <div id="arabicText" class="arabic"></div>
      
      <button class="btn-success" onclick="revealNextAyah()">Reveal Next Verse</button>
      
      <div id="revealBox" class="reveal-box hidden">
        <div style="font-weight: bold; color: #009736; margin-bottom: 8px;">Next Verse:</div>
        <div id="nextVerse" class="arabic"></div>
      </div>
    </div>
  </div>

  <script>
    // 1. Populate the dropdown with options: Juzuk 1 to Juzuk 30
    const juzSelect = document.getElementById('juzSelect');
    for (let i = 1; i <= 30; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `Juzuk ${i}`;
      juzSelect.appendChild(opt);
    }

    let currentSurah = null;
    let currentAyah = null;

    // 2. Main function to generate random verse
    async function generateRandomAyah() {
      const selectedJuz = juzSelect.value;
      const quizSection = document.getElementById('quizSection');
      const revealBox = document.getElementById('revealBox');
      const status = document.getElementById('status');

      // Reset view states
      quizSection.classList.add('hidden');
      revealBox.classList.add('hidden');
      document.getElementById('nextVerse').innerText = '';
      status.innerText = "Generating Ayah...";
      status.style.color = "#000000";
      status.classList.remove('hidden');

      try {
        let ayahData;

        if (selectedJuz === 'all') {
          // Fetch from entire Quran
          const res = await fetch('https://api.alquran.cloud/v1/ayah/random/quran-uthmani');
          const data = await res.json();
          ayahData = data.data;
        } else {
          // Fetch specific Juzuk content
          const res = await fetch(`https://api.alquran.cloud/v1/juz/${selectedJuz}/quran-uthmani`);
          const data = await res.json();
          const ayahsInJuz = data.data.ayahs;
          
          // Select random index inside chosen Juzuk
          const randomIndex = Math.floor(Math.random() * ayahsInJuz.length);
          ayahData = ayahsInJuz[randomIndex];
        }

        currentSurah = ayahData.surah.number;
        currentAyah = ayahData.numberInSurah;

        // Populate content
        document.getElementById('meta').innerText = `Surah ${ayahData.surah.englishName} (${currentSurah}:${currentAyah}) • Juzuk ${ayahData.juz}`;
        document.getElementById('arabicText').innerText = ayahData.text;
        
        status.classList.add('hidden');
        quizSection.classList.remove('hidden');

      } catch (err) {
        status.innerText = "Connection error. Please check internet connection.";
        status.style.color = "#EE2A35";
      }
    }

    // 3. Function to reveal the consecutive verse
    async function revealNextAyah() {
      const revealBox = document.getElementById('revealBox');
      const nextVerseDiv = document.getElementById('nextVerse');
      const nextAyahNum = currentAyah + 1;

      nextVerseDiv.innerText = "Fetching next verse...";
      revealBox.classList.remove('hidden');

      try {
        const res = await fetch(`https://api.alquran.cloud/v1/ayah/${currentSurah}:${nextAyahNum}/quran-uthmani`);
        const data = await res.json();
        
        if (data.code === 200) {
          nextVerseDiv.innerText = data.data.text;
        } else {
          nextVerseDiv.innerText = "End of Surah reached!";
        }
      } catch (err) {
        nextVerseDiv.innerText = "Failed to load next verse.";
      }
    }
  </script>

</body>
</html>
